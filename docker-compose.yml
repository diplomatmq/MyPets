services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5183:80"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgresql://duo_pet:duo_pet_local@postgres:5432/duo_pet
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8011:3000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: duo-pet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: duo_pet
      POSTGRES_USER: duo_pet
      POSTGRES_PASSWORD: duo_pet_local
    volumes:
      - duo_pet_postgres:/var/lib/postgresql/data
      - ./backend/database/001_foundation.sql:/docker-entrypoint-initdb.d/001_foundation.sql:ro

  redis:
    image: redis:7-alpine
    container_name: duo-pet-redis
    restart: unless-stopped

volumes:
    duo_pet_postgres:
